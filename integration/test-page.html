<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UISpec Test Page</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: system-ui, sans-serif;
      }
      #header {
        background: #333;
        color: white;
        padding: 1rem;
        display: flex;
        align-items: center;
        gap: 1rem;
      }
      #logo {
        font-weight: bold;
      }
      #searchInput {
        margin-left: auto;
        padding: 0.5rem;
      }
      #sidebar {
        width: 200px;
        background: #f5f5f5;
        padding: 1rem;
        float: left;
      }
      #main {
        margin-left: 200px;
        padding: 1rem;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="header" data-ui="dashboard/header" role="banner">
      <span id="logo" data-ui="dashboard/logo" role="img" aria-label="Company Logo">Logo</span>
      <input
        id="searchInput"
        data-ui="dashboard/searchInput"
        type="search"
        role="searchbox"
        placeholder="Search..."
        aria-label="Search"
      />
      <button
        id="notifications"
        data-ui="dashboard/notifications"
        role="button"
        aria-label="Notifications"
      >
        🔔
      </button>
      <button id="userMenu" data-ui="dashboard/userMenu" role="button" aria-label="User Menu">
        👤
      </button>
    </div>

    <aside id="sidebar" data-ui="dashboard/sidebar" role="navigation">
      <a href="#" id="navHome" data-ui="dashboard/navHome" role="link" aria-label="Home">Home</a>
      <a href="#" id="navProjects" data-ui="dashboard/navProjects" role="link" aria-label="Projects"
        >Projects</a
      >
      <a href="#" id="navSettings" data-ui="dashboard/navSettings" role="link" aria-label="Settings"
        >Settings</a
      >
    </aside>

    <main id="main" data-ui="dashboard/main" role="main">
      <h1 data-ui="dashboard/contentTitle">Dashboard</h1>
      <div id="content" data-ui="dashboard/content">
        <p>Welcome to the dashboard</p>
      </div>
    </main>

    <div
      id="settingsModal"
      class="hidden"
      data-ui="dashboard/settingsModal"
      role="dialog"
      aria-modal="true"
    >
      <h2>Settings</h2>
    </div>

    <script>
      window.__UISPEC_TEST__ = true;
    </script>
  </body>
</html>
